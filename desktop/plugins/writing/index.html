<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{color-scheme:light;--bg:#fff;--text:#303030;--muted:#858585;--line:#ececec;--soft:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI","Microsoft YaHei UI",sans-serif}body.dark{color-scheme:dark;--bg:#202020;--text:#ededed;--muted:#aaa;--line:#393939;--soft:#2a2a2a}header{height:48px;display:flex;gap:5px;align-items:center;padding:0 18px;border-bottom:1px solid var(--line)}button{border:0;background:none;color:inherit;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}button:hover,button.active{background:var(--soft)}button:focus-visible{outline:2px solid #888;outline-offset:2px}.spacer{flex:1}.save{background:var(--text);color:var(--bg)}.save:hover{opacity:.85;background:var(--text)}main{height:calc(100vh - 80px);overflow:auto}textarea{display:block;resize:none;border:0;outline:0;background:transparent;color:inherit;font:15px/1.9 "Segoe UI","Microsoft YaHei UI",sans-serif;max-width:820px;width:100%;height:100%;padding:40px 50px;margin:auto}article{padding:36px 50px;max-width:820px;margin:auto;font-size:15px;line-height:1.9;overflow-wrap:anywhere}article h1{font-size:29px;line-height:1.5}article h2{font-size:22px;margin-top:30px}article pre{overflow:auto;background:var(--soft);padding:16px;border-radius:8px}footer{height:32px;padding:7px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:600px){textarea,article{padding:24px}}
article table{border-collapse:collapse;width:100%;font-size:13px}article th,article td{border-bottom:1px solid var(--line);padding:8px;text-align:left}article th{background:var(--soft)}article blockquote{margin-left:0;border-left:3px solid var(--line);padding-left:16px;color:var(--muted)}article code{background:var(--soft);border-radius:3px;padding:2px 4px}article pre code{padding:0}article li{margin:6px 0}article .document-link{color:#4e7a9d;text-decoration:underline}</style></head><body><header><button title="标题" id="heading">H₂</button><button title="加粗" id="bold"><b>B</b></button><button title="列表" id="list">☷</button><span class="spacer"></span><button class="active" id="edit">编辑</button><button id="preview">预览</button><button class="save" id="save">保存</button></header><main><textarea id="text" aria-label="文档正文" spellcheck="false"></textarea><article id="render" hidden></article></main><footer id="status">正在加载…</footer><script>
const input=document.getElementById('text'),render=document.getElementById('render'),status=document.getElementById('status');let sequence=0,pending=new Map();
function call(method,params){return new Promise((resolve,reject)=>{const id=String(++sequence);pending.set(id,{resolve,reject});parent.postMessage({channel:'cowork-plugin-v1',id,method,params},'*')})}
function theme(value){document.body.classList.toggle('dark',value==='dark')}
addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='cowork-host-v1')return;const v=e.data;if(v.event==='document'){input.value=v.data.text;theme(v.data.theme);status.textContent=v.data.name+' · 已保存'}if(v.event==='theme')theme(v.data);if(v.id&&pending.has(v.id)){const p=pending.get(v.id);pending.delete(v.id);v.error?p.reject(Error(v.error)):p.resolve(v.result)}});
input.addEventListener('input',()=>{status.textContent='未保存 · '+input.value.length+' 字符';call('document.change',{text:input.value}).catch(e=>status.textContent=e.message)});
function insert(before,after=''){const start=input.selectionStart,end=input.selectionEnd;input.setRangeText(before+input.value.slice(start,end)+after,start,end,'end');input.focus();input.dispatchEvent(new Event('input'))}
document.getElementById('heading').onclick=()=>insert('## ');document.getElementById('bold').onclick=()=>insert('**','**');document.getElementById('list').onclick=()=>insert('- ');
async function save(){status.textContent='正在保存…';try{await call('document.save');status.textContent='已保存 · '+input.value.length+' 字符'}catch(e){status.textContent=e.message}}
document.getElementById('save').onclick=save;addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
async function preview(show){input.hidden=show;render.hidden=!show;document.getElementById('edit').classList.toggle('active',!show);document.getElementById('preview').classList.toggle('active',show);if(show){try{const value=await call('document.render');render.innerHTML=value.html}catch(e){render.textContent='预览未完成：'+e.message}}}
document.getElementById('edit').onclick=()=>preview(false);document.getElementById('preview').onclick=()=>preview(true);parent.postMessage({channel:'cowork-plugin-v1',method:'ready'},'*');
</script></body></html>
