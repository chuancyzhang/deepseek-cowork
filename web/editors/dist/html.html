<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: qrc:; script-src 'self' qrc:; worker-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:">
    <title>HTML 可视化编辑器</title>
    <link rel="stylesheet" href="editor.css">
  </head>
  <body>
    <main class="editor-shell">
      <nav class="editor-toolbar" aria-label="HTML 编辑工具">
        <select data-html-command="formatBlock" aria-label="段落样式">
          <option value="p">正文</option>
          <option value="h1">标题 1</option>
          <option value="h2">标题 2</option>
          <option value="h3">标题 3</option>
          <option value="blockquote">引用</option>
        </select>
        <button type="button" data-html-command="bold"><strong>B</strong></button>
        <button type="button" data-html-command="italic"><em>I</em></button>
        <button type="button" data-html-command="underline"><u>U</u></button>
        <span class="toolbar-separator"></span>
        <button type="button" data-html-command="insertUnorderedList">• 列表</button>
        <button type="button" data-html-command="insertOrderedList">1. 列表</button>
        <button type="button" data-html-command="justifyLeft">左</button>
        <button type="button" data-html-command="justifyCenter">中</button>
        <button type="button" data-html-command="justifyRight">右</button>
        <span class="toolbar-separator"></span>
        <button type="button" data-html-action="link">链接</button>
        <label title="文字颜色">颜色 <input type="color" data-html-command="foreColor" value="#17171a"></label>
      </nav>
      <section class="html-workspace">
        <iframe id="html-frame" sandbox="allow-same-origin" title="HTML 可视化编辑区域"></iframe>
      </section>
    </main>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="html-editor.js"></script>
  </body>
</html>
