services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: cowork
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowork -d cowork"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ${COWORK_ENV_FILE:-.env}
    environment:
      COWORK_DATA_DIR: /data
    volumes:
      - releases:/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      COWORK_HOST: ${COWORK_HOST:?Set COWORK_HOST}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy:/data
    depends_on:
      - platform
    restart: unless-stopped
volumes:
  database:
  releases:
  caddy:
